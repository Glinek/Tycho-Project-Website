<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tycho Project</title>
    
    <!-- Czcionki Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="favicon.png" />

    <style>
        /* =========================================
           ZMIENNE GLOBALNE I BAZA
        ========================================= */
        :root {
            --color-bg-dark: #222;
            --color-primary-blue: #0f49be;
            --color-primary-glow: rgba(15, 73, 190, 0.4);
            --color-primary-glow-strong: rgba(15, 73, 190, 0.6);
            --color-primary-hover: rgba(15, 73, 190, 0.1);
            
            --color-text-main: #ffffff;
            --color-text-secondary: #000000;
            --color-text-muted: #cccccc;
            --color-text-dimmed: #e0e0e0;
            --color-success: #2ecc71;
            
            --color-border: rgba(255, 255, 255, 0.15);

            --font-main: 'Roboto Mono', monospace;
            --font-pixel: 'Press Start 2P', Courier, monospace;

            --fw-light: 200;
            --fw-regular: 400;
            --fw-semi: 600;
            --fw-bold: 700;

            --fs-sm: 0.9rem;
            --fs-base: 1rem;
            --fs-md: 1.1rem;
            --fs-lg: 1.2rem;
            --fs-xl: 2.7rem;
            --fs-xxl: 3.5rem;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: var(--font-main);
            background-color: var(--color-bg-dark);
            color: var(--color-text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        .site-main {
            flex: 1 0 auto; 
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================================
           NAGŁÓWEK (HEADER)
        ========================================= */
        .siteHeader {
            display: flex;
            justify-content: flex-start; /* Logo wyrównane do lewej */
            align-items: center;
            padding: 1.5rem 2rem;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--color-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .headerLogo a {
            color: var(--color-text-main);
            text-decoration: none;
            font-family: var(--font-pixel);
            font-size: var(--fs-md);
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--color-primary-glow);
            display: block;
        }

        .headerLogo img {
            max-height: 45px;
            width: auto;
            display: block;
        }

        /* =========================================
           GŁÓWNA SEKCJA (HERO - Website in progress)
        ========================================= */
        .home-section {
            text-align: center;
            padding: 2rem;
        }

        .highlight {
            color: var(--color-primary-blue);
            text-shadow: 0 0 20px var(--color-primary-glow-strong);
            font-family: var(--font-pixel);
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            line-height: 1.5;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }

        .typing-cursor {
            display: inline-block;
            animation: blink 1s step-end infinite;
            margin-left: 8px;
            color: var(--color-primary-blue);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* =========================================
           STOPKA (FOOTER)
        ========================================= */
        .siteFooter {
            position: relative;
            color: var(--color-text-dimmed);
            font-family: var(--font-main);
            padding: 8rem 2rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: auto; 
            overflow: hidden;
            background: transparent;
        }

        .footer-bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .layer-1 {
            background-color: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            animation: crystalLayer1 8s ease-in-out infinite alternate;
        }

        .layer-2 {
            background-color: rgba(25, 25, 25, 0.8);
            animation: crystalLayer2 6s ease-in-out infinite alternate;
        }

        .layer-3 {
            background-color: rgba(20, 20, 20, 0.9);
            animation: crystalLayer3 4s ease-in-out infinite alternate;
        }

        @keyframes crystalLayer1 {
            0% { clip-path: polygon(0% 4vw, 20% 0vw, 45% 5vw, 75% 1vw, 100% 3vw, 100% 100%, 0% 100%); }
            100% { clip-path: polygon(0% 1vw, 30% 6vw, 60% 1vw, 85% 5vw, 100% 2vw, 100% 100%, 0% 100%); }
        }

        @keyframes crystalLayer2 {
            0% { clip-path: polygon(0% 6vw, 25% 3vw, 55% 8vw, 80% 4vw, 100% 7vw, 100% 100%, 0% 100%); }
            100% { clip-path: polygon(0% 4vw, 35% 7vw, 50% 3vw, 70% 8vw, 100% 4vw, 100% 100%, 0% 100%); }
        }

        @keyframes crystalLayer3 {
            0% { clip-path: polygon(0% 9vw, 30% 5vw, 50% 10vw, 70% 6vw, 100% 8vw, 100% 100%, 0% 100%); }
            100% { clip-path: polygon(0% 7vw, 20% 9vw, 45% 6vw, 75% 10vw, 100% 6vw, 100% 100%, 0% 100%); }
        }

        .footer-bottom {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 800px;
            padding-top: 1.5rem;
            text-align: center;
            font-size: var(--fs-sm);
            letter-spacing: 0.5px;
        }

        .footer-bottom p {
            margin: 0 0 0.5rem 0;
        }

        .heart {
            color: var(--color-success);
        }

        /* =========================================
           RESPONSYWNOŚĆ (MOBILE)
        ========================================= */
        @media (max-width: 768px) {
            .siteFooter { padding-top: 6rem; }
            .layer-1 { animation: crystalMobile1 8s ease-in-out infinite alternate; }
            .layer-2 { animation: crystalMobile2 6s ease-in-out infinite alternate; }
            .layer-3 { animation: crystalMobile3 4s ease-in-out infinite alternate; }
        }

        @keyframes crystalMobile1 {
            0% { clip-path: polygon(0% 30px, 30% 10px, 60% 35px, 100% 15px, 100% 100%, 0% 100%); }
            100% { clip-path: polygon(0% 15px, 40% 40px, 70% 15px, 100% 30px, 100% 100%, 0% 100%); }
        }

        @keyframes crystalMobile2 {
            0% { clip-path: polygon(0% 45px, 35% 25px, 65% 50px, 100% 30px, 100% 100%, 0% 100%); }
            100% { clip-path: polygon(0% 30px, 25% 45px, 55% 25px, 100% 45px, 100% 100%, 0% 100%); }
        }

        @keyframes crystalMobile3 {
            0% { clip-path: polygon(0% 60px, 25% 45px, 50% 65px, 75% 50px, 100% 55px, 100% 100%, 0% 100%); }
            100% { clip-path: polygon(0% 50px, 35% 60px, 60% 45px, 100% 60px, 100% 100%, 0% 100%); }
        }
    </style>
</head>
<body>

    <!-- NAGŁÓWEK -->
    <header class="siteHeader">
        <div class="headerLogo">
            <a href="#"><img src="logo.png" alt="Logo" /></a>
        </div>
    </header>

    <!-- GŁÓWNA ZAWARTOŚĆ -->
    <main class="site-main home-section">
        <div class="content hero-content">
            <h1 class="highlight">
                Tycho Project is in progress<span class="typing-cursor">|</span>
            </h1>
        </div>
    </main>

    <!-- STOPKA -->
    <footer class="siteFooter">
        <div class="footer-bg-layer layer-1"></div>
        <div class="footer-bg-layer layer-2"></div>
        <div class="footer-bg-layer layer-3"></div>

        <div class="footer-bottom">
            <p>Made with <span class="heart">💛</span> by Simon</p>
            <p>Copyright &copy; 2026 Szymon Glinka</p>
            <p>This site does NOT use cookies for tracking or collect your personal information.</p>
        </div>
    </footer>

</body>
</html>
